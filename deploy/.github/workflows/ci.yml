name: MiningIntel CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish validated container images to GHCR
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: miningintel, POSTGRES_PASSWORD: test-password, POSTGRES_DB: miningintel_test}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U miningintel -d miningintel_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ['6333:6333']
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://miningintel:test-password@localhost:5432/miningintel_test
      TEST_DATABASE_URL: postgresql+asyncpg://miningintel:test-password@localhost:5432/miningintel_test
      REDIS_URL: redis://localhost:6379/0
      TEST_QDRANT_URL: http://localhost:6333
      PYTHONPATH: ${{ github.workspace }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.lock}
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check --config pyproject.toml app tests alembic ../pipeline ../scripts
      - run: ruff format --check --config pyproject.toml app tests alembic ../pipeline ../scripts
      - run: alembic upgrade head
      - run: pytest -q
      - run: alembic check
      - run: alembic downgrade base && alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions: {contents: read, packages: write}
    strategy:
      matrix:
        include:
          - {image: api, dockerfile: backend/Dockerfile}
          - {image: worker, dockerfile: pipeline/Dockerfile}
          - {image: frontend, dockerfile: frontend/Dockerfile}
          - {image: backup, dockerfile: deploy/backup/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate workflow mirror and Compose
        run: |
          cmp .github/workflows/ci.yml deploy/.github/workflows/ci.yml
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/miningintel-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_images) }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate alert rules and simulated firing
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/rules:ro" prom/prometheus:v3.2.1 check rules /rules/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy:/rules:ro" -w /rules prom/prometheus:v3.2.1 test rules alert-tests.yml
      - name: Validate deploy scripts
        run: bash -n deploy/release.sh
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend, containers, monitoring]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    permissions: {contents: read, packages: read}
    concurrency: {group: miningintel-production, cancel-in-progress: false}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/miningintel' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH connection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ && "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_DIR" =~ ^/(opt|srv|home)/[a-zA-Z0-9_/-]+$ && "$DEPLOY_DIR" != */../* ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/miningintel
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/miningintel ~/.ssh/known_hosts
          printf 'Host ecs\n HostName %s\n User %s\n Port %s\n IdentityFile ~/.ssh/miningintel\n StrictHostKeyChecking yes\n' "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" > ~/.ssh/config
      - name: Transfer configuration and immutable image references
        shell: bash
        run: |
          set -euo pipefail
          ssh ecs "mkdir -p '$DEPLOY_DIR/deploy'"
          rsync -az -e ssh deploy/ "ecs:$DEPLOY_DIR/deploy/"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for image in api worker frontend backup; do
            printf '%s_IMAGE=%s/miningintel-%s:%s\n' "${image^^}" "$registry" "$image" "$GITHUB_SHA"
          done > .images.next.env
          scp .images.next.env "ecs:$DEPLOY_DIR/.images.next.env"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Transfer authenticated images and deploy
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          images=()
          for image in api worker frontend backup; do
            reference="$registry/miningintel-$image:$GITHUB_SHA"
            docker pull "$reference"
            images+=("$reference")
          done
          docker save "${images[@]}" | gzip -3 > images.tar.gz
          checksum=$(sha256sum images.tar.gz | cut -d ' ' -f 1)
          scp images.tar.gz "ecs:$DEPLOY_DIR/.images-$GITHUB_SHA.tar.gz"
          ssh ecs "printf '%s  %s\n' '$checksum' '$DEPLOY_DIR/.images-$GITHUB_SHA.tar.gz' | sha256sum -c - && gzip -dc '$DEPLOY_DIR/.images-$GITHUB_SHA.tar.gz' | docker load && rm -- '$DEPLOY_DIR/.images-$GITHUB_SHA.tar.gz'"
          ssh ecs "MININGINTEL_IMAGES_PRELOADED=true COMPOSE_PROFILES=monitoring,backup bash '$DEPLOY_DIR/deploy/release.sh' '$DEPLOY_DIR'"
