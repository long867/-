[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "miningintel-backend"
version = "0.1.0"
description = "MiningIntel API, retrieval and asynchronous ingestion"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "pgvector>=0.3.6,<1", "redis>=5.2,<7", "celery[redis]>=5.4,<6",
  "qdrant-client>=1.14,<2",
  "slowapi>=0.1.9,<0.2",
  "tzdata>=2025.1",
  "httpx>=0.28,<1", "feedparser>=6.0,<7", "trafilatura>=2,<3",
  "python-dateutil>=2.9,<3",
  "langdetect>=1.0.9,<2", "tenacity>=9,<10", "beautifulsoup4>=4.13,<5",
  "playwright>=1.50,<2", "spacy>=3.8,<4",
  "llama-index-core>=0.12,<0.15", "jieba>=0.42,<1",
  "structlog>=25,<26", "prometheus-client>=0.21,<1",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "pyyaml>=6,<7",
]

[project.optional-dependencies]
ml = ["FlagEmbedding>=1.3,<2", "torch>=2.5,<3", "transformers>=4.44,<5"]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1", "respx>=0.22,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
markers = ["integration: requires PostgreSQL 16 + pgvector"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
